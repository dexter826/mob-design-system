name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: |
          npm run check:tokens
          npm test

      - name: Package standalone assets
        run: |
          zip -r mob-signal-fonts.zip fonts/
          zip -r mob-signal-logos.zip logos/exports/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            colors_and_type.css
            components.css
            overlays.css
            mob-signal-fonts.zip
            mob-signal-logos.zip
