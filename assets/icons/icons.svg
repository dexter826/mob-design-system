<?xml version="1.0" encoding="UTF-8"?>
<!-- ===========================================================================
     M.O.B Signal — icon sprite (65 symbols, ids prefixed "i-")
     =======================================================================
     EXTRAPOLATED BRAND WORK, authored for this system. The source archive
     (historical design input (not bundled)) supplied NO icons: the whole
     reference page contains one decorative <svg> and there is no icon file, no
     icon font and no glyph sheet in the bundle. This set is therefore measured
     against the brand's geometry rules, not transcribed from evidence, and it is
     deliberately not a generic library: orthogonal strokes and true 45 deg
     diagonals only, no arcs, no rounded joins, no circular blobs.

     Consume it as, adding the size modifier for the 16 / 20 / 24 step:
       <svg class="mob-icon" aria-hidden="true">
         <use href="icons.svg#i-check"></use>
       </svg>

     Geometry contract (see assets/icons/icons.css for the full family rules):
       - viewBox 0 0 24 24, live area 20x20, 2px padding, centreline coords in 2..22
       - stroke 1.5px at the 24px box, butt caps, miter joins, fill: none
       - colour is always currentColor; nothing here bakes in the accent
       - the only fills are solid square markers (fill="currentColor" stroke="none")
         used for status dots, git nodes, keyholes, quota use and list/key marks
       - centrelines sit on whole or half units so the 1.5 band straddles the grid
         symmetrically at the 2x render target
     ========================================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">

  <!-- ===================== STATUS ===================== -->

  <!-- Confirmation. Two 45 deg strokes, no curve in the tick. -->
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M4.5 12.5 L9.5 17.5 L19.5 7.5"/>
  </symbol>

